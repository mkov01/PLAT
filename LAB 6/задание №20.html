<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание 3 — Профессиональный Кликер</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .game-card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .game-box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .counter-label {
            font-size: 1.1rem;
            font-weight: bold;
            color: #38bdf8;
        }

        .game-viewport {
            width: 100%;
            height: 320px;
            background-color: #020617;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            border: 2px solid #334155;
        }

        /* Стили игрового объекта */
        #targetObj {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.6);
            transition: left 0.15s ease-out, top 0.15s ease-out, transform 0.1s ease;
        }

        #targetObj:active {
            transform: scale(0.85);
        }

        .btn-restart {
            width: 100%;
            padding: 0.75rem;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
            display: none;
            transition: background 0.2s;
        }

        .btn-restart:hover {
            background-color: #059669;
        }

        .victory-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(2, 6, 23, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-size: 1.5rem;
            color: #10b981;
            font-weight: bold;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; } to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="game-card">
        <div class="game-box-header">
            <span class="counter-label">Счет: <span id="currentScore">0</span> / 10</span>
            <span id="gameStatus" style="color: #a1a1aa;">Статус: В игре</span>
        </div>

        <div class="game-viewport" id="viewport">
            <div id="targetObj" role="button" aria-label="Поймай меня"></div>
            <div class="victory-screen" id="victoryScreen">
                <span>Победа! 🎉</span>
            </div>
        </div>

        <button class="btn-restart" id="restartBtn">Играть заново</button>
    </div>

    <script>
        'use strict';
        (() => {
            const viewport = document.querySelector('#viewport');
            const targetObj = document.querySelector('#targetObj');
            const currentScoreEl = document.querySelector('#currentScore');
            const gameStatus = document.querySelector('#gameStatus');
            const victoryScreen = document.querySelector('#victoryScreen');
            const restartBtn = document.querySelector('#restartBtn');

            let userScore = 0;
            const winConditionScore = 10;

            const relocateTarget = () => {
                // Точный расчет геометрии контейнера
                const viewportRect = viewport.getBoundingClientRect();
                const targetRect = targetObj.getBoundingClientRect();

                const limitX = viewportRect.width - targetRect.width;
                const limitY = viewportRect.height - targetRect.height;

                const coordX = Math.floor(Math.random() * limitX);
                const coordY = Math.floor(Math.random() * limitY);

                targetObj.style.transform = 'none'; // Сброс центрирования
                targetObj.style.left = `${coordX}px`;
                targetObj.style.top = `${coordY}px`;
            };

            targetObj.addEventListener('click', () => {
                if (userScore >= winConditionScore) return;

                userScore++;
                currentScoreEl.textContent = userScore;

                if (userScore === winConditionScore) {
                    gameStatus.textContent = 'Статус: Завершена';
                    gameStatus.style.color = '#10b981';
                    targetObj.style.display = 'none';
                    victoryScreen.style.display = 'flex';
                    restartBtn.style.display = 'block';
                } else {
                    relocateTarget();
                }
            });

            restartBtn.addEventListener('click', () => {
                userScore = 0;
                currentScoreEl.textContent = userScore;
                gameStatus.textContent = 'Статус: В игре';
                gameStatus.style.color = '#a1a1aa';
                victoryScreen.style.display = 'none';
                restartBtn.style.display = 'none';
                
                targetObj.style.display = 'block';
                targetObj.style.left = '50%';
                targetObj.style.top = '50%';
                targetObj.style.transform = 'translate(-50%, -50%)';
            });
        })();
    </script>
</body>
</html>
