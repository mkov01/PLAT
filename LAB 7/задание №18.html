<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPA Панель заказов</title>
    <!-- Иконки FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Шрифт Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1e38 100%);
            --panel-bg: rgba(30, 41, 59, 0.7);
            --card-bg: rgba(15, 23, 42, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            --accent-new: #38bdf8;
            --accent-work: #fbbf24;
            --accent-ready: #34d399;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: start;
        }

        .dashboard {
            width: 100%;
            max-width: 1200px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 i {
            color: var(--accent-new);
        }

        .tabs {
            display: flex;
            gap: 15px;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 12px 24px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
        }

        .tab-btn.active[data-tab="new"] {
            border-color: var(--accent-new);
            color: var(--accent-new);
            background: rgba(56, 189, 248, 0.1);
        }
        .tab-btn.active[data-tab="work"] {
            border-color: var(--accent-work);
            color: var(--accent-work);
            background: rgba(251, 191, 36, 0.1);
        }
        .tab-btn.active[data-tab="ready"] {
            border-color: var(--accent-ready);
            color: var(--accent-ready);
            background: rgba(52, 211, 153, 0.1);
        }

        .badge {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
        }
        .tab-btn.active[data-tab="new"] .badge { background: var(--accent-new); color: #0f172a; }
        .tab-btn.active[data-tab="work"] .badge { background: var(--accent-work); color: #0f172a; }
        .tab-btn.active[data-tab="ready"] .badge { background: var(--accent-ready); color: #0f172a; }

        .tab-content {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            animation: fadeIn 0.4s ease forwards;
        }

        .tab-content.active {
            display: grid;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .order-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .order-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .order-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .order-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .order-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .order-id {
            font-weight: 700;
            font-size: 14px;
            color: var(--text-muted);
        }

        .order-price {
            font-weight: 700;
            color: #fff;
            background: rgba(255,255,255,0.05);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 14px;
        }

        .order-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .order-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.4;
            flex-grow: 1;
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-work {
            background: var(--accent-work);
            color: #0f172a;
        }
        .btn-work:hover { background: #fcd34d; }

        .btn-ready {
            background: var(--accent-ready);
            color: #0f172a;
        }
        .btn-ready:hover { background: #6ee7b7; }

        .btn-archive {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }
        .btn-archive:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state i {
            font-size: 48px;
            margin-bottom: 15px;
            display: block;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="header">
            <h1><i class="fa-solid fa-list-check"></i> Панель Заказов</h1>
            <div class="tabs">
                <button class="tab-btn active" data-tab="new">
                    Новые <span class="badge" id="count-new">0</span>
                </button>
                <button class="tab-btn" data-tab="work">
                    В работе <span class="badge" id="count-work">0</span>
                </button>
                <button class="tab-btn" data-tab="ready">
                    Готовые <span class="badge" id="count-ready">0</span>
                </button>
            </div>
        </div>

        <div id="new" class="tab-content active"></div>
        <div id="work" class="tab-content"></div>
        <div id="ready" class="tab-content"></div>
    </div>

    <script>
        // Данные с реальными картинками из Unsplash
        let orders = [
            {
                id: "№ 1024",
                title: "Пицца Пепперони XL",
                desc: "Двойная порция моцареллы, пикантные колбаски пепперони, фирменный томатный соус.",
                price: "890 ₽",
                image: "https://images.unsplash.com/photo-1628840042765-356cda07504e?w=500&auto=format&fit=crop&q=60",
                status: "new"
            },
            {
                id: "№ 1025",
                title: "Бургер «Шеф-Титаник»",
                desc: "Мраморная говядина, карамелизированный лук, сыр чеддер, секретный соус.",
                price: "550 ₽",
                image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500&auto=format&fit=crop&q=60",
                status: "new"
            },
            {
                id: "№ 1026",
                title: "Сет Роллов Филадельфия",
                desc: "Свежий лосось, нежный творожный сыр, спелый авокадо, рис, нори.",
                price: "1200 ₽",
                image: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=500&auto=format&fit=crop&q=60",
                status: "work"
            },
            {
                id: "№ 1027",
                title: "Капучино & Круассан",
                desc: "Большой кофе на миндальном молоке и классический французский круассан.",
                price: "380 ₽",
                image: "https://images.unsplash.com/photo-1517701604599-bb29b565090c?w=500&auto=format&fit=crop&q=60",
                status: "ready"
            }
        ];

        function renderOrders() {
            const containers = {
                new: document.getElementById('new'),
                work: document.getElementById('work'),
                ready: document.getElementById('ready')
            };

            Object.values(containers).forEach(c => c.innerHTML = '');

            let counts = { new: 0, work: 0, ready: 0 };

            orders.forEach(order => {
                counts[order.status]++;

                const card = document.createElement('div');
                card.className = 'order-card';
                
                let buttonHTML = '';
                if (order.status === 'new') {
                    buttonHTML = `<button class="action-btn btn-work" onclick="changeStatus('${order.id}', 'work')"><i class="fa-solid fa-play"></i> В работу</button>`;
                } else if (order.status === 'work') {
                    buttonHTML = `<button class="action-btn btn-ready" onclick="changeStatus('${order.id}', 'ready')"><i class="fa-solid fa-check"></i> Готово</button>`;
                } else if (order.status === 'ready') {
                    buttonHTML = `<button class="action-btn btn-archive" onclick="deleteOrder('${order.id}')"><i class="fa-solid fa-box-archive"></i> В архив</button>`;
                }

                card.innerHTML = `
                    <img class="order-img" src="${order.image}" alt="${order.title}">
                    <div class="order-body">
                        <div class="order-meta">
                            <span class="order-id">${order.id}</span>
                            <span class="order-price">${order.price}</span>
                        </div>
                        <h3 class="order-title">${order.title}</h3>
                        <p class="order-desc">${order.desc}</p>
                        ${buttonHTML}
                    </div>
                `;

                containers[order.status].appendChild(card);
            });

            document.getElementById('count-new').innerText = counts.new;
            document.getElementById('count-work').innerText = counts.work;
            document.getElementById('count-ready').innerText = counts.ready;

            Object.keys(containers).forEach(status => {
                if (counts[status] === 0) {
                    containers[status].innerHTML = `
                        <div class="empty-state">
                            <i class="fa-regular fa-folder-open"></i>
                            <p>В этой категории пока нет заказов</p>
                        </div>
                    `;
                }
            });
        }

        function changeStatus(orderId, newStatus) {
            const order = orders.find(o => o.id === orderId);
            if (order) {
                order.status = newStatus;
                renderOrders();
            }
        }

        function deleteOrder(orderId) {
            orders = orders.filter(o => o.id !== orderId);
            renderOrders();
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

                btn.classList.add('active');
                const targetTab = btn.getAttribute('data-tab');
                document.getElementById(targetTab).classList.add('active');
            });
        });

        renderOrders();
    </script>
</body>
</html>
